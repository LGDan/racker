services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: racker
      POSTGRES_PASSWORD: racker
      POSTGRES_DB: racker
    volumes:
      - racker-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racker -d racker"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    image: racker-web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://racker:racker@db:5432/racker?schema=public
      AUTH_SECRET: racker-dcim-super-secret-jwt-key-2026
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-Single Sign-On}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-groups}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-racker-admins}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-STANDARD}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT:-}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-}
      OIDC_USERINFO_ENDPOINT: ${OIDC_USERINFO_ENDPOINT:-}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  e2e-db-init:
    image: postgres:16-alpine
    profiles: ["e2e"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: racker
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -h db -U racker -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'racker_e2e'" | grep -q 1 \
          || psql -h db -U racker -d postgres -c "CREATE DATABASE racker_e2e"

  web-e2e:
    image: racker-web
    profiles: ["e2e"]
    build: .
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://racker:racker@db:5432/racker_e2e?schema=public
      AUTH_SECRET: racker-dcim-super-secret-jwt-key-2026
    depends_on:
      db:
        condition: service_healthy
      e2e-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: Dockerfile.e2e
    ipc: host
    volumes:
      - ./playwright.config.ts:/work/playwright.config.ts:ro
      - ./e2e:/work/e2e
    environment:
      BASE_URL: http://web-e2e:3000
    depends_on:
      web-e2e:
        condition: service_healthy

volumes:
  racker-pg:
